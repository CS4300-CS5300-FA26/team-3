name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: budgetwise.ci_settings
      AWS_EC2_METADATA_DISABLED: "true"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: budgetwise_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d budgetwise_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django and migrations
        run: |
          python src/manage.py check
          python src/manage.py makemigrations --check --dry-run
          python src/manage.py migrate --noinput
      - name: Run tests
        run: python src/manage.py test tests src --noinput
