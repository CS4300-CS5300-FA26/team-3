<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:24px; background:#f3f6f1; color:#101820; font:16px/1.6 Arial,sans-serif;">
    <div style="max-width:560px; margin:0 auto; padding:28px; background:#ffffff; border:1px solid #dce5d8; border-radius:8px;">
        <h1 style="margin:0 0 24px; color:#234f2b; font:32px Georgia,serif;">BudgetWise</h1>
        {{ intro|linebreaks }}
        <p style="margin:24px 0;">
            <a href="{{ link }}" style="display:inline-block; padding:12px 24px; background:#234f2b; border-radius:4px; color:#ffffff; font-weight:bold; text-decoration:none;">{{ action }}</a>
        </p>
        {{ details|linebreaks }}
        <p style="margin-top:24px; color:#56616b;">The BudgetWise team</p>
    </div>
</body>
</html>
