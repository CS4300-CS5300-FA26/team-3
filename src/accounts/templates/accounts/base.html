<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BudgetWise{% endblock %}</title>
    <style>
        body {
            margin: 0;
            background: #f6f7f2;
            color: #101820;
            font: 18px/1.5 Arial, sans-serif;
        }
        .site-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 24px;
            padding: 14px 3%;
            background: #e9efe6;
            border-bottom: 1px solid #afc0ad;
            color: #104b25;
            font: 32px/1.2 Georgia, serif;
        }
        .brand { color: #104b25; text-decoration: none; font: 32px/1.2 Georgia, serif; }
        a { color: #104b25; }
        a:hover { text-decoration: underline; }
        :focus-visible { outline: 3px solid #104b25; outline-offset: 3px; }
        .site-nav { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; font: 18px/1.5 Arial, sans-serif; }
        .site-nav a { padding: 8px 0; }
        .site-nav form { margin: 0; padding: 0; border: 0; background: transparent; }
        .site-nav button, .button.secondary { border: 1px solid #104b25; background: transparent; color: #104b25; }
        .skip-link { position: absolute; left: 16px; top: -100px; padding: 10px; background: white; z-index: 1; }
        .skip-link:focus { top: 12px; }
        main { max-width: 480px; margin: 48px auto; padding: 0 20px; }
        main > p { overflow-wrap: anywhere; }
        h1 { margin: 0 0 24px; color: #104b25; font: 36px/1.2 Georgia, serif; }
        h2 { margin: 0 0 24px; color: #104b25; font: 28px/1.2 Georgia, serif; }
        .panel, form { padding: 24px; background: white; border: 1px solid #afc0ad; border-radius: 10px; }
        form p { margin: 0 0 20px; }
        label, legend { display: block; margin-bottom: 6px; font-weight: bold; }
        fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
        fieldset label { font-weight: normal; }
        form > div, fieldset > div { margin-bottom: 20px; }
        select, input:not([type="radio"]):not([type="checkbox"]) {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #56616b;
            border-radius: 4px;
            font: inherit;
        }
        input:focus-visible, button:focus-visible { outline: 3px solid #104b25; outline-offset: 2px; }
        button, .button {
            padding: 10px 18px;
            border: 0;
            border-radius: 4px;
            background: #104b25;
            color: white;
            font: inherit;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }
        [role="status"] { padding: 12px 16px; background: #e9efe6; border-left: 4px solid #104b25; }
        [role="status"]:empty { display: none; }
        @media (max-width: 480px) {
            main { margin: 32px auto; padding: 0 16px; }
            .panel, form { padding: 20px; }
            h1 { font-size: 32px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
        }
        button:disabled { cursor: wait; opacity: 0.75; }
        .errorlist { margin: 0 0 8px; padding: 0; list-style: none; color: #9b1c1c; }
        .password-field { position: relative; display: block; }
        .password-field input { padding-right: 48px; }
        .password-toggle { position: absolute; top: 1px; right: 1px; bottom: 1px; width: 44px; padding: 10px; background: transparent; color: #104b25; }
        .password-toggle svg { display: block; width: 22px; height: 22px; }
        .eye-slash { visibility: hidden; }
        input[type="text"] + .password-toggle .eye-slash { visibility: visible; }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <a class="brand" href="{% url 'dashboard' %}">BudgetWise</a>
        {% include "accounts/navigation.html" %}
    </header>
    <main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
    <script>
        document.querySelectorAll('button[data-pending-label]').forEach((button) => {
            const form = button.form;
            const label = button.textContent;
            const status = document.createElement('p');
            status.setAttribute('role', 'status');
            form.after(status);
            // Native validation runs before submit, including keyboard submission.
            form.addEventListener('submit', (event) => {
                if (event.defaultPrevented) return;
                if (button.disabled) {
                    event.preventDefault();
                    return;
                }
                button.textContent = button.dataset.pendingLabel;
                button.disabled = true;
                form.setAttribute('aria-busy', 'true');
                status.textContent = 'Please wait. This may take a few moments.';
            });
            // A page restored with Back may retain its previous disabled state.
            window.addEventListener('pageshow', () => {
                button.textContent = label;
                button.disabled = false;
                form.removeAttribute('aria-busy');
                status.textContent = '';
            });
        });
        document.querySelectorAll('input[type="password"]').forEach((input) => {
            const field = document.createElement('span');
            const button = document.createElement('button');
            const label = input.labels[0].textContent.replace(/:$/, '').toLowerCase();
            button.type = 'button';
            button.className = 'password-toggle';
            button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>';
            button.setAttribute('aria-label', `Show ${label}`);
            button.setAttribute('aria-controls', input.id);
            button.addEventListener('click', () => {
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                button.setAttribute('aria-label', `${show ? 'Hide' : 'Show'} ${label}`);
            });
            field.className = 'password-field';
            input.before(field);
            field.append(input, button);
        });
    </script>
</body>
</html>
