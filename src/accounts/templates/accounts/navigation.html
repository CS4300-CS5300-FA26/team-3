<nav class="site-nav" aria-label="Main navigation">
    {% if request.user.is_authenticated %}
        {% if request.resolver_match.url_name != 'dashboard' and request.resolver_match.url_name != 'home' %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
        {% endif %}
        <a href="{% url 'account_settings' %}"{% if request.resolver_match.url_name == 'account_settings' %} aria-current="page"{% endif %}>Account</a>
        <form method="post" action="{% url 'sign_out' %}">
            {% csrf_token %}
            <button type="submit">Sign out</button>
        </form>
    {% else %}
        <a href="{% url 'accounts:signup' %}">Create account</a>
        <a href="{% url 'sign_in' %}">Sign in</a>
    {% endif %}
</nav>
