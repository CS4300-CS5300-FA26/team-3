{% extends "accounts/base.html" %}
{% block title %}Sign in | BudgetWise{% endblock %}
{% block content %}
    <h1>Sign in</h1>
    {% if error %}<p class="errorlist" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="username" maxlength="150" required>
        </p>
        <p>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </p>
        <button type="submit" data-pending-label="Signing in…">Sign in</button>
    </form>
    <p>New to BudgetWise? <a href="{% url 'accounts:signup' %}">Create account</a></p>
{% endblock %}
