<script>
(function () {
    window.initializeReceiptScanner = function (root) {
        const forms = root.querySelectorAll(".transaction-form");

        forms.forEach(function (form) {
            const receiptUpload = form.querySelector(".receipt-upload");
            const receiptStatus = form.querySelector(".receipt-status");
            const amountInput = form.querySelector('[name="amount"]');

            if (!receiptUpload || !receiptStatus || !amountInput) return;
            if (receiptUpload.dataset.initialized === "true") return;

            receiptUpload.dataset.initialized = "true";

            let scanController = null;
            let lastScannedAmount = null;

            receiptUpload.addEventListener("change", async function () {
                if (scanController) {
                    scanController.abort();
                    scanController = null;
                }

                if (lastScannedAmount !== null &&
                    amountInput.value === lastScannedAmount) {
                    amountInput.value = "";
                }
                lastScannedAmount = null;

                const file = receiptUpload.files[0];
                receiptStatus.classList.remove("receipt-error");

                if (!file) {
                    receiptStatus.textContent = "";
                    return;
                }

                const allowedTypes = ["image/jpeg", "image/png", "image/webp"];
                const allowedExtensions = /\.(jpg|jpeg|png|webp)$/i;

                const validType = allowedTypes.includes(file.type);
                const validExtension = allowedExtensions.test(file.name);

                if (!validType && !validExtension) {
                    receiptStatus.textContent = "Unsupported receipt image format.";
                    receiptStatus.classList.add("receipt-error");
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    receiptStatus.textContent = "Receipt image must be 5 MB or smaller.";
                    receiptStatus.classList.add("receipt-error");
                    return;
                }

                receiptStatus.textContent = "Scanning receipt...";

                const data = new FormData();
                data.append("receipt", file);

                const csrfToken = form.querySelector(
                    'input[name="csrfmiddlewaretoken"]'
                )?.value;

                const controller = new AbortController();
                scanController = controller;

                try {
                    const response = await fetch(
                        "{% url 'scan_receipt_upload' %}",
                        {
                            method: "POST",
                            headers: {"X-CSRFToken": csrfToken},
                            body: data,
                            signal: controller.signal
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || "Receipt scanning failed.");
                    }

                    if (scanController !== controller) return;

                    if (result.amount !== null && result.amount !== undefined) {
                        amountInput.value = result.amount;
                        lastScannedAmount = String(result.amount);
                        receiptStatus.textContent =
                            "Receipt total detected: $" + result.amount +
                            ". You can edit the amount before saving.";
                    } else {
                        receiptStatus.textContent =
                            result.message || "Could not read a total. Enter it manually.";
                        receiptStatus.classList.add("receipt-error");
                    }
                } catch (error) {
                    if (error.name === "AbortError") return;
                    if (scanController !== controller) return;

                    receiptStatus.textContent =
                        error.message || "Receipt scanning failed.";
                    receiptStatus.classList.add("receipt-error");
                } finally {
                    if (scanController === controller) {
                        scanController = null;
                    }
                }
            });
        });
    };

    window.initializeReceiptScanner(document);
})();
</script>
