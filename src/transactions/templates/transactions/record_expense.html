{% extends "accounts/base.html" %}

{% block title %}Record expense | BudgetWise{% endblock %}

{% block content %}
<h1>Record expense</h1>
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
        <form method="post">
            {% csrf_token %}
            {% include "transactions/expense_fields.html" %}
            <button type="submit">Save expense</button>
        </form>
{% endblock %}
