<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record expense | BudgetWise</title>
    <style>
        body {
            margin: 0;
            background: #f3f6f1;
            color: #101820;
            font: 18px/1.5 Arial, sans-serif;
        }
        header {
            padding: 18px 3%;
            background: #e9efe6;
            border-bottom: 1px solid #afc0ad;
            color: #104b25;
            font: 32px/1.2 Georgia, serif;
        }
        header a { color: inherit; text-decoration: none; }
        header a:hover, header a:focus-visible { text-decoration: underline; }
        main { max-width: 480px; margin: 48px auto; padding: 0 20px; }
        h1 { margin: 0 0 24px; color: #104b25; font: 36px/1.2 Georgia, serif; }
        form { padding: 24px; background: white; border: 1px solid #afc0ad; border-radius: 8px; }
        form > div { margin: 0 0 20px; }
        label, legend { display: block; margin-bottom: 6px; padding: 0; font-weight: bold; }
        fieldset { margin: 0; padding: 0; border: 0; }
        fieldset label { font-weight: normal; }
        select, input:not([type="radio"]) {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #56616b;
            border-radius: 4px;
            font: inherit;
        }
        select:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid #104b25; outline-offset: 2px; }
        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 4px;
            background: #104b25;
            color: white;
            font: inherit;
            cursor: pointer;
        }
        .errorlist { margin: 0 0 8px; padding: 0; list-style: none; color: #9b1c1c; }
        [role="status"] { padding: 12px; background: #e9efe6; border-left: 4px solid #104b25; }
    </style>
</head>
<body>
    <header><a href="{% url 'dashboard' %}">BudgetWise</a></header>
    <main>
        <h1>Record expense</h1>
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <button type="submit">Save expense</button>
        </form>
    </main>
</body>
</html>
