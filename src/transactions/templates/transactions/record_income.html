<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record income | BudgetWise</title>
</head>
<body>
    <main>
        <h1>Record income</h1>
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save income</button>
        </form>
    </main>
</body>
</html>
