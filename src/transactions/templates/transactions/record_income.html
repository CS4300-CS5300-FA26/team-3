{% extends "accounts/base.html" %}

{% block title %}Record income | BudgetWise{% endblock %}

{% block content %}
<h1>Record income</h1>
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save income</button>
        </form>
{% endblock %}
